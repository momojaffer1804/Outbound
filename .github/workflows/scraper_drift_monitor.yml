name: Scraper Drift & Admissions Health Monitor

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  monitor-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Drift Monitor
        run: |
          python backend/ingestion/check_scraper_drift.py

      - name: Upload Drift Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-drift-report
          path: backend/data/scraper_drift_report.json
          retention-days: 30
